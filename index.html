/* ============================= STOCKAGE ============================= */
// Tout est stocké en "shared" : chef, admin, élèves et profs doivent
// pouvoir voir les mêmes données (comptes, commandes, stock, menus).

async function sGet(key) {
  try {
    const r = await window.storage.get(key, true);
    return r ? JSON.parse(r.value) : null;
  } catch (e) {
    return null;
  }
}
async function sSet(key, value) {
  try {
    await window.storage.set(key, JSON.stringify(value), true);
    return true;
  } catch (e) {
    return false;
  }
}
async function sDelete(key) {
  try {
    await window.storage.delete(key, true);
  } catch (e) {}
}
async function sList(prefix) {
  try {
    const r = await window.storage.list(prefix, true);
    return r ? r.keys : [];
  } catch (e) {
    return [];
  }
}

const uid = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 7);
const todayStr = () => new Date().toISOString().slice(0, 10);
const eur = (n) => `${Number(n).toFixed(2).replace(".", ",")} €`;

async function hashPassword(pw) {
  try {
    const enc = new TextEncoder().encode(pw);
    const buf = await crypto.subtle.digest("SHA-256", enc);
    return Array.from(new Uint8Array(buf)).map((b) => b.toString(16).padStart(2, "0")).join("");
  } catch (e) {
    return pw; // solution de repli si crypto.subtle est indisponible
  }
}

function getMonday(offsetWeeks) {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1) + offsetWeeks * 7;
  const monday = new Date(d);
  monday.setHours(0, 0, 0, 0);
  monday.setDate(diff);
  return monday;
}
function weekDates(offsetWeeks) {
  const monday = getMonday(offsetWeeks);
  return JOURS.map((j, i) => {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    return { jour: j, date: d.toISOString().slice(0, 10), label: d.toLocaleDateString("fr-FR", { day: "2-digit", month: "2-digit" }) };
  });
}
function weekKey(offsetWeeks) {
  return "menu:" + getMonday(offsetWeeks).toISOString().slice(0, 10);
}

/* ============================= NOTIFICATIONS ============================= */

async function pushNotif(userId, message) {
  const key = "notifs:" + userId;
  const list = (await sGet(key)) || [];
  list.unshift({ id: uid(), message, date: new Date().toISOString(), lu: false });
  await sSet(key, list.slice(0, 40));
}

const DEFAULT_ADMIN_ID = "campus-rosaparks";
const DEFAULT_ADMIN_PW = "campusrosaparks";

async function ensureDefaultAdmin() {
  const key = "users:" + DEFAULT_ADMIN_ID;
  const existing = await sGet(key);
  if (!existing) {
    await sSet(key, {
      id: DEFAULT_ADMIN_ID,
      password: await hashPassword(DEFAULT_ADMIN_PW),
      nom: "Administration",
      role: "admin",
      section: null,
      solde: 0,
      createdAt: new Date().toISOString(),
    });
  }
}

function AuthScreen({ onLogin }) {
  const [role, setRole] = useState("eleve");
  const [mode, setMode] = useState("login"); // login | register
  const [id, setId] = useState("");
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [nom, setNom] = useState("");
  const [section, setSection] = useState("college");
  const [err, setErr] = useState("");
  const [busy, setBusy] = useState(false);

  const roles = [
    { key: "eleve", label: "Élève", icon: GraduationCap },
    { key: "prof", label: "Professeur", icon: Users },
    { key: "chef", label: "Chef·fe", icon: ChefHat },
    { key: "admin", label: "Admin", icon: ShieldCheck },
  ];

  const canRegister = role === "eleve" || role === "prof";
  const [storageOk, setStorageOk] = useState(true);
  const [checking, setChecking] = useState(true);

  useEffect(() => {
    (async () => {
      await ensureDefaultAdmin();
      try {
        const testKey = "healthcheck";
        const setOk = await window.storage.set(testKey, "1", true);
        const got = await window.storage.get(testKey, true);
        setStorageOk(!!setOk && !!got);
      } catch (e) {
        setStorageOk(false);
      }
      setChecking(false);
    })();
  }, []);
  useEffect(() => { if (!canRegister) setMode("login"); }, [role]);

  function reset() {
    setId(""); setPw(""); setPw2(""); setNom(""); setSection("college"); setErr("");
  }

  async function handleLogin(e) {
    e.preventDefault();
    setErr(""); setBusy(true);
    if (role === "admin") await ensureDefaultAdmin();
    const key = "users:" + id.trim().toLowerCase();
    const u = await sGet(key);
    const hashed = await hashPassword(pw);
    setBusy(false);
    if (!u) return setErr("Identifiant introuvable pour ce rôle. Vérifiez l'orthographe ou créez un compte.");
    if (u.role !== role) return setErr(`Ce compte est enregistré comme "${roleLabel(u.role)}", pas comme "${roleLabel(role)}".`);
    if (u.password !== hashed) return setErr("Mot de passe incorrect.");
    onLogin(u);
  }

  async function handleRegister(e) {
    e.preventDefault();
    setErr("");
    if (!id.trim() || !pw || !nom.trim()) return setErr("Merci de remplir tous les champs.");
    if (pw !== pw2) return setErr("Les deux mots de passe ne correspondent pas.");
    if (pw.length < 4) return setErr("Le mot de passe doit faire au moins 4 caractères.");
    setBusy(true);
    const key = "users:" + id.trim().toLowerCase();
    const existing = await sGet(key);
    if (existing) { setBusy(false); return setErr("Cet identifiant est déjà pris."); }
    const newUser = {
      id: id.trim().toLowerCase(),
      password: await hashPassword(pw),
      nom: nom.trim(),
      role,
      section: role === "eleve" || role === "prof" ? section : null,
      solde: 0,
      createdAt: new Date().toISOString(),
    };
    const saved = await sSet(key, newUser);
    setBusy(false);
    if (!saved) return setErr("Impossible d'enregistrer le compte (problème de stockage). Réessayez.");
    onLogin(newUser);
  }

  return (
    <div style={{ background: "var(--bg)", minHeight: "100vh" }} className="flex items-center justify-center p-4">
      <GlobalStyle />
      <div className="w-full max-w-md">
        <div className="flex flex-col items-center gap-3 mb-7">
          <div style={{ background: "linear-gradient(135deg, var(--pine), var(--sage))", boxShadow: "var(--shadow)" }} className="w-14 h-14 rounded-2xl flex items-center justify-center">
            <UtensilsCrossed size={26} color="white" />
          </div>
          <div className="text-center">
            <h1 className="text-2xl">Turabo Self</h1>
            <p className="text-sm mt-1" style={{ color: "#7C8079" }}>La cantine, simplement.</p>
          </div>
        </div>

        {!checking && !storageOk && (
          <div className="mb-4 p-3 text-sm flex items-start gap-2" style={{ background: "var(--tomato-light)", color: "var(--tomato)", borderRadius: 12 }}>
            <AlertCircle size={16} style={{ flexShrink: 0, marginTop: 2 }} />
            <span>Le stockage persistant ne répond pas dans cet aperçu. Les comptes créés risquent de ne pas être retrouvés à la reconnexion. Essayez de recharger l'artifact, ou vérifiez que le stockage est activé.</span>
          </div>
        )}

        <div className="ticket p-1 flex gap-1 mb-4">
          {roles.map((r) => (
            <button
              key={r.key}
              onClick={() => { setRole(r.key); reset(); }}
              className="btn flex-1 py-2 px-1 flex flex-col items-center gap-1 text-xs"
              style={{
                background: role === r.key ? "var(--pine)" : "transparent",
                color: role === r.key ? "white" : "var(--ink)",
              }}
            >
              <r.icon size={16} />
              {r.label}
            </button>
          ))}
        </div>

        <div className="ticket p-6">
          <div className="flex gap-4 mb-5 border-b" style={{ borderColor: "var(--line)" }}>
            <button
              onClick={() => { setMode("login"); reset(); }}
              className="pb-3 text-sm font-semibold"
              style={{ borderBottom: mode === "login" ? "2px solid var(--pine)" : "2px solid transparent", color: mode === "login" ? "var(--pine)" : "#8A8578" }}
            >
              Connexion
            </button>
            {canRegister && (
              <button
                onClick={() => { setMode("register"); reset(); }}
                className="pb-3 text-sm font-semibold"
                style={{ borderBottom: mode === "register" ? "2px solid var(--pine)" : "2px solid transparent", color: mode === "register" ? "var(--pine)" : "#8A8578" }}
              >
                Créer un compte
              </button>
            )}
          </div>

          {!canRegister && (
            <p className="text-xs mb-4 flex items-center gap-2" style={{ color: "#8A8578" }}>
              <Lock size={13} /> Les comptes {role === "chef" ? "chef·fe" : "admin"} sont créés uniquement par l'administration, depuis l'onglet Utilisateurs.
            </p>
          )}

          {mode === "login" ? (
            <form onSubmit={handleLogin} className="flex flex-col gap-3">
              <Field label="Identifiant"><input className="input" value={id} onChange={(e) => setId(e.target.value)} placeholder="ex: julie.d" /></Field>
              <Field label="Mot de passe"><input type="password" className="input" value={pw} onChange={(e) => setPw(e.target.value)} /></Field>
              {err && <ErrorMsg text={err} />}
              <button disabled={busy} className="btn btn-primary py-2.5 mt-1 flex items-center justify-center gap-2">
                Se connecter <ArrowRight size={16} />
              </button>
            </form>
          ) : (
            <form onSubmit={handleRegister} className="flex flex-col gap-3">
              <Field label="Nom complet"><input className="input" value={nom} onChange={(e) => setNom(e.target.value)} placeholder="ex: Julie Dupont" /></Field>
              <Field label="Identifiant de connexion"><input className="input" value={id} onChange={(e) => setId(e.target.value)} placeholder="ex: julie.d" /></Field>
              <Field label="Mot de passe"><input type="password" className="input" value={pw} onChange={(e) => setPw(e.target.value)} /></Field>
              <Field label="Confirmer le mot de passe"><input type="password" className="input" value={pw2} onChange={(e) => setPw2(e.target.value)} /></Field>
              {(role === "eleve" || role === "prof") && (
                <Field label="Vous êtes en :">
                  <div className="flex gap-2">
                    {["college", "lycee"].map((s) => (
                      <button
                        type="button"
                        key={s}
                        onClick={() => setSection(s)}
                        className="btn flex-1 py-2 text-sm"
                        style={{ background: section === s ? "var(--amber)" : "var(--paper)", color: section === s ? "white" : "var(--ink)", border: "1px solid var(--line)" }}
                      >
                        {s === "college" ? "Collège" : "Lycée"}
                      </button>
                    ))}
                  </div>
                </Field>
              )}
              {err && <ErrorMsg text={err} />}
              <button disabled={busy} className="btn btn-primary py-2.5 mt-1 flex items-center justify-center gap-2">
                Créer mon compte <ArrowRight size={16} />
              </button>
            </form>
          )}
        </div>
        <p className="text-center text-xs mt-4" style={{ color: "#8A8578" }}>
          Les mots de passe sont chiffrés avant d'être enregistrés. Les commandes, le stock et les menus restent visibles par toute l'équipe de la cantine (élèves, profs, chef·fe, admin) — c'est ce qui permet à chacun de voir les mêmes informations en temps réel.
        </p>
      </div>
    </div>
  );
}

function roleLabel(r) {
  return { eleve: "Élève", prof: "Professeur", chef: "Chef·fe", admin: "Admin" }[r] || r;
}

function Field({ label, children }) {
  return (
    <label className="flex flex-col gap-1 text-sm">
      <span style={{ color: "#5B5748", fontWeight: 500 }}>{label}</span>
      {children}
    </label>
  );
}
function ErrorMsg({ text }) {
  return (
    <div className="flex items-center gap-2 text-sm p-2" style={{ background: "var(--tomato-light)", color: "var(--tomato)" }}>
      <AlertCircle size={15} /> {text}
    </div>
  );
}

function TopBar({ user, bump }) {
  const [notifs, setNotifs] = useState([]);
  const [open, setOpen] = useState(false);

  const load = useCallback(async () => {
    const list = (await sGet("notifs:" + user.id)) || [];
    setNotifs(list);
  }, [user.id]);

  useEffect(() => { load(); const t = setInterval(load, 8000); return () => clearInterval(t); }, [load]);

  async function markAllRead() {
    const updated = notifs.map((n) => ({ ...n, lu: true }));
    await sSet("notifs:" + user.id, updated);
    setNotifs(updated);
  }

  const unread = notifs.filter((n) => !n.lu).length;

  return (
    <header className="ticket flex items-center justify-between px-6 py-3" style={{ borderLeft: "none", borderTop: "none", borderRight: "none" }}>
      <h2 className="text-lg">Bonjour, {user.nom.split(" ")[0]}</h2>

            <Wallet size={15} /> {eur(user.solde || 0)}
          </div>
        )}
        <div className="relative">
          <button onClick={() => setOpen((o) => !o)} className="btn btn-outline p-2 relative">
            <Bell size={16} />
            {unread > 0 && (
              <span className="absolute -top-1 -right-1 text-[10px] w-4 h-4 rounded-full flex items-center justify-center" style={{ background: "var(--tomato)", color: "white" }}>
                {unread}
              </span>
            )}
          </button>
          {open && (
            <div className="ticket absolute right-0 mt-2 w-80 z-20 shadow-lg max-h-96 overflow-y-auto">
              <div className="flex items-center justify-between p-3 border-b" style={{ borderColor: "var(--line)" }}>
                <span className="font-semibold text-sm">Notifications</span>

              </div>
              {notifs.length === 0 && <p className="text-sm p-4" style={{ color: "#8A8578" }}>Aucune notification.</p>}
              {notifs.map((n) => (
                <div key={n.id} className="p-3 text-sm border-b" style={{ borderColor: "var(--line)", background: n.lu ? "transparent" : "var(--amber-light)" }}>
                  <p>{n.message}</p>
                  <p className="text-xs mt-1" style={{ color: "#8A8578" }}>{new Date(n.date).toLocaleString("fr-FR")}</p>

          )}
        </div>
      </div>
    </header>
  );
}

function MenuView({ editable, onNotifySavedChef }) {
  const [offset, setOffset] = useState(0);
  const [menu, setMenu] = useState({});
  const [saving, setSaving] = useState(false);

  const load = useCallback(async () => {
    const m = await sGet(weekKey(offset));
    setMenu(m || {});
  }, [offset]);
  useEffect(() => { load(); }, [load]);

  function update(date, field, value) {
    setMenu((m) => ({ ...m, [date]: { ...(m[date] || {}), [field]: value } }));
  }
  async function save() {
    setSaving(true);
    await sSet(weekKey(offset), menu);
    setSaving(false);
    if (onNotifySavedChef) onNotifySavedChef();
  }

  const dates = weekDates(offset);

  return (
    <div>
      <div className="flex items-center gap-2 mb-5">
        {[0, 1, 2].map((o) => (
          <button key={o} onClick={() => setOffset(o)} className="btn py-1.5 px-3 text-sm" style={{ background: offset === o ? "var(--pine)" : "var(--paper)", color: offset === o ? "white" : "var(--ink)", border: "1px solid var(--line)" }}>
            {o === 0 ? "Cette semaine" : o === 1 ? "Semaine prochaine" : "Dans 2 semaines"}
          </button>
        ))}
      </div>
      <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))" }}>
        {dates.map((d) => {
          const day = menu[d.date] || {};
          return (
            <div key={d.date} className="ticket p-4">
              <p className="font-semibold text-sm mb-3" style={{ color: "var(--pine)" }}>{d.jour} <span style={{ color: "#8A8578", fontWeight: 400 }}>· {d.label}</span></p>
              {["entree", "plat", "dessert"].map((field) => (
                <div key={field} className="mb-2">
                  <span className="text-xs uppercase tracking-wide" style={{ color: "#8A8578" }}>{field === "entree" ? "Entrée" : field === "plat" ? "Plat" : "Dessert"}</span>
                  {editable ? (
                    <input className="input mt-1 text-sm py-1.5" value={day[field] || ""} onChange={(e) => update(d.date, field, e.target.value)} placeholder="—" />
                  ) : (
                    <p className="text-sm mt-1">{day[field] || "Non renseigné"}</p>
                  )}
                </div>
              ))}
              <div className="mb-1">
                <span className="text-xs uppercase tracking-wide" style={{ color: "#8A8578" }}>Prix du repas</span>
                {editable ? (
                  <input type="number" min="0" step="0.10" className="input mt-1 text-sm py-1.5" value={day.prix ?? ""} onChange={(e) => update(d.date, "prix", e.target.value === "" ? "" : Number(e.target.value))} placeholder={String(MEAL_PRICE)} />
                ) : (
                  <p className="text-sm mt-1 font-semibold">{eur(day.prix || MEAL_PRICE)}</p>
                )}
              </div>
            </div>
          );
        })}
      </div>
      {editable && (
        <button onClick={save} disabled={saving} className="btn btn-primary py-2.5 px-5 mt-5">
          {saving ? "Enregistrement..." : "Enregistrer le menu"}
        </button>
      )}
    </div>
  );
}

function StockView({ editable }) {
  const [stock, setStock] = useState([]);
  const [nom, setNom] = useState("");
  const [qte, setQte] = useState("");
  const [unite, setUnite] = useState("kg");
  const [editingId, setEditingId] = useState(null);
  const [editDraft, setEditDraft] = useState({});

  const load = useCallback(async () => {
    setStock((await sGet("stock")) || []);
  }, []);
  useEffect(() => { load(); }, [load]);

  async function addItem(e) {
    e.preventDefault();
    if (!nom.trim() || qte === "") return;
    const updated = [...stock, { id: uid(), nom: nom.trim(), quantite: Number(qte), unite }];
    await sSet("stock", updated);
    setStock(updated);
    setNom(""); setQte("");
  }
  async function changeQty(id, delta) {
    const updated = stock.map((s) => (s.id === id ? { ...s, quantite: Math.max(0, s.quantite + delta) } : s));
    await sSet("stock", updated);
    setStock(updated);
  }
  async function removeItem(id) {
    const updated = stock.filter((s) => s.id !== id);
    await sSet("stock", updated);
    setStock(updated);
  }
  function startEdit(s) {
    setEditingId(s.id);
    setEditDraft({ nom: s.nom, quantite: s.quantite, unite: s.unite });
  }
  async function saveEdit(id) {
    const updated = stock.map((s) => (s.id === id ? { ...s, nom: editDraft.nom.trim() || s.nom, quantite: Number(editDraft.quantite) || 0, unite: editDraft.unite } : s));
    await sSet("stock", updated);
    setStock(updated);
    setEditingId(null);
  }

  return (
    <div>
      {editable && (
        <form onSubmit={addItem} className="ticket p-4 mb-5 flex flex-wrap gap-2 items-end">
          <Field label="Article"><input className="input" value={nom} onChange={(e) => setNom(e.target.value)} placeholder="ex: Tomates" /></Field>
          <Field label="Quantité"><input type="number" min="0" className="input w-28" value={qte} onChange={(e) => setQte(e.target.value)} /></Field>
          <Field label="Unité">
            <select className="input" value={unite} onChange={(e) => setUnite(e.target.value)}>
              <option value="kg">kg</option><option value="L">L</option><option value="unités">unités</option>
            </select>
          </Field>
          <button className="btn btn-primary py-2.5 px-4 flex items-center gap-1"><Plus size={15} /> Ajouter</button>
        </form>
      )}
      <div className="ticket">
        {stock.length === 0 && <p className="p-4 text-sm" style={{ color: "#8A8578" }}>Aucun article en stock pour le moment.</p>}
        {stock.map((s) => (
          <div key={s.id} className="flex items-center justify-between px-4 py-3 border-b last:border-0 flex-wrap gap-2" style={{ borderColor: "var(--line)" }}>
            {editingId === s.id ? (
              <div className="flex flex-wrap gap-2 items-end flex-1">
                <input className="input py-1.5 text-sm" style={{ maxWidth: 160 }} value={editDraft.nom} onChange={(e) => setEditDraft((d) => ({ ...d, nom: e.target.value }))} />
                <input type="number" min="0" className="input py-1.5 text-sm w-24" value={editDraft.quantite} onChange={(e) => setEditDraft((d) => ({ ...d, quantite: e.target.value }))} />
                <select className="input py-1.5 text-sm w-28" value={editDraft.unite} onChange={(e) => setEditDraft((d) => ({ ...d, unite: e.target.value }))}>
                  <option value="kg">kg</option><option value="L">L</option><option value="unités">unités</option>
                </select>
                <button onClick={() => saveEdit(s.id)} className="btn btn-primary py-1.5 px-3 text-sm">Enregistrer</button>
                <button onClick={() => setEditingId(null)} className="btn btn-outline py-1.5 px-3 text-sm">Annuler</button>
              </div>
            ) : (
              <>
                <div>
                  <p className="font-medium text-sm">{s.nom}</p>
                  <p className="text-xs" style={{ color: s.quantite < 5 ? "var(--tomato)" : "#8A8578" }}>{s.quantite} {s.unite} {s.quantite < 5 ? "· stock bas" : "disponible"}</p>
                </div>
                {editable && (
                  <div className="flex items-center gap-2">
                    <button onClick={() => changeQty(s.id, -1)} className="btn btn-outline w-7 h-7 flex items-center justify-center">-</button>
                    <button onClick={() => changeQty(s.id, 1)} className="btn btn-outline w-7 h-7 flex items-center justify-center">+</button>
                    <button onClick={() => startEdit(s)} className="btn btn-outline py-1.5 px-3 text-xs">Modifier</button>
                    <button onClick={() => removeItem(s.id)} className="btn p-1.5" style={{ color: "var(--tomato)" }}><Trash2 size={15} /></button>
                  </div>
                )}
              </>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

async function loadAllOrders() {
  const keys = await sList("orders:");
  const list = await Promise.all(keys.map((k) => sGet(k)));
  return list.filter(Boolean).sort((a, b) => new Date(b.date) - new Date(a.date));

function OrderForm({ user, bump }) {
  const [offset, setOffset] = useState(0);
  const [menu, setMenu] = useState({});
  const [myOrders, setMyOrders] = useState([]);
  const [msg, setMsg] = useState("");

  const load = useCallback(async () => {
    const m = await sGet(weekKey(offset));
    setMenu(m || {});
    setMyOrders((await loadAllOrders()).filter((o) => o.userId === user.id));
  }, [offset, user.id]);
  useEffect(() => { load(); }, [load]);

  async function order(date, jour) {
    setMsg("");
    const day = menu[date];
    if (!day || !day.plat) return setMsg("Aucun plat programmé ce jour-là.");
    if (date < todayStr()) return setMsg("Impossible de commander pour un jour passé.");
    const already = myOrders.some((o) => o.date === date && o.statut !== "refusee");
    if (already) return setMsg("Vous avez déjà commandé pour ce jour.");
    const prix = Number(day.prix) > 0 ? Number(day.prix) : MEAL_PRICE;
    const freshUser = await sGet("users:" + user.id);
    if ((freshUser.solde || 0) < prix) return setMsg("Solde insuffisant. Gagnez de l'argent via les mini-jeux ou rechargez votre solde.");
    const newSolde = freshUser.solde - prix;
    await sSet("users:" + user.id, { ...freshUser, solde: newSolde });
    const orderObj = {
      id: uid(), userId: user.id, userNom: user.nom, role: user.role,
      date, jour, plat: day.plat, entree: day.entree, dessert: day.dessert,
      prix, statut: "en_attente", createdAt: new Date().toISOString(),
    };
    await sSet("orders:" + orderObj.id, orderObj);
    setMsg("Commande envoyée, en attente de validation !");
    load();
    bump();
  }

  const dates = weekDates(offset);

  return (
    <div>
      <h1 className="text-2xl mb-5">Commander un repas</h1>
      <div className="flex items-center gap-2 mb-5">
        {[0, 1].map((o) => (
          <button key={o} onClick={() => setOffset(o)} className="btn py-1.5 px-3 text-sm" style={{ background: offset === o ? "var(--pine)" : "var(--paper)", color: offset === o ? "white" : "var(--ink)", border: "1px solid var(--line)" }}>
            {o === 0 ? "Cette semaine" : "Semaine prochaine"}
          </button>
        ))}
      </div>
      {msg && <div className="mb-4 text-sm p-3" style={{ background: "var(--amber-light)", color: "var(--amber)" }}>{msg}</div>}
      <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(220px, 1fr))" }}>
        {dates.map((d) => {
          const day = menu[d.date] || {};
          const already = myOrders.some((o) => o.date === d.date && o.statut !== "refusee");
          const past = d.date < todayStr();
          return (
            <div key={d.date} className="ticket p-4 flex flex-col">
              <p className="font-semibold text-sm mb-2" style={{ color: "var(--pine)" }}>{d.jour} · {d.label}</p>
              {day.plat ? (
                <div className="text-sm flex-1 mb-3">
                  <p style={{ color: "#8A8578" }}>{day.entree || "—"}</p>
                  <p className="font-medium my-1">{day.plat}</p>
                  <p style={{ color: "#8A8578" }}>{day.dessert || "—"}</p>
                </div>
              ) : (
                <p className="text-sm flex-1 mb-3" style={{ color: "#8A8578" }}>Menu non défini.</p>
              )}
              <p className="text-xs mb-2 font-semibold">{eur(Number(day.prix) > 0 ? Number(day.prix) : MEAL_PRICE)}</p>
              <button
                disabled={!day.plat || already || past}
                onClick={() => order(d.date, d.jour)}
                className="btn btn-amber py-2 text-sm disabled:opacity-40"
              >
                {already ? "Déjà commandé" : past ? "Jour passé" : "Commander"}
              </button>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function GamesView({ user, bump }) {
  const [gainsToday, setGainsToday] = useState(0);
  const [activeGame, setActiveGame] = useState(null);
  const [flash, setFlash] = useState("");

  const key = "gains:" + user.id + ":" + todayStr();
  const load = useCallback(async () => { setGainsToday((await sGet(key)) || 0); }, [key]);
  useEffect(() => { load(); }, [load]);

  const remaining = DAILY_GAME_WIN_CAP - gainsToday;

  async function reward() {
    if (remaining <= 0) return;
    const freshUser = await sGet("users:" + user.id);
    await sSet("users:" + user.id, { ...freshUser, solde: (freshUser.solde || 0) + GAME_REWARD });
    await sSet(key, gainsToday + 1);
    setGainsToday((g) => g + 1);
    setFlash(`Bravo, +${eur(GAME_REWARD)} ajoutés à votre solde !`);
    setActiveGame(null);
    bump();
    setTimeout(() => setFlash(""), 4000);
  }

  const games = [
    { key: "quiz", label: "Quiz express", icon: Brain, desc: "Une question, une bonne réponse." },
    { key: "memory", label: "Memory", icon: Sparkles, desc: "Retrouvez les 3 paires." },
    { key: "reflexe", label: "Réflexe", icon: Timer, desc: "Cliquez pile au bon moment." },
  ];

  return (
    <div>
      <h1 className="text-2xl mb-2">Mini-jeux</h1>
      <p className="text-sm mb-5" style={{ color: "#8A8578" }}>
        Gagnez {eur(GAME_REWARD)} par jeu réussi — limité à {DAILY_GAME_WIN_CAP} gains par jour. Il vous reste <strong>{Math.max(remaining, 0)}</strong> gain(s) aujourd'hui.
      </p>
      {flash && <div className="mb-4 text-sm p-3 flex items-center gap-2" style={{ background: "var(--sage-light)", color: "var(--sage)" }}><Trophy size={16} /> {flash}</div>}

      {!activeGame && (
        <div className="grid gap-3" style={{ gridTemplateColumns: "repeat(auto-fit, minmax(200px, 1fr))" }}>
          {games.map((g) => (
            <button
              key={g.key}
              disabled={remaining <= 0}
              onClick={() => setActiveGame(g.key)}
              className="ticket p-5 text-left disabled:opacity-40"
            >
              <g.icon size={20} color="var(--amber)" />
              <p className="font-semibold mt-2">{g.label}</p>
              <p className="text-xs mt-1" style={{ color: "#8A8578" }}>{g.desc}</p>

          ))}
        </div>

      {activeGame === "quiz" && <QuizGame onWin={reward} onQuit={() => setActiveGame(null)} />}
      {activeGame === "memory" && <MemoryGame onWin={reward} onQuit={() => setActiveGame(null)} />}
      {activeGame === "reflexe" && <ReflexGame onWin={reward} onQuit={() => setActiveGame(null)} />}
    </div>
  );
}

function QuizGame({ onWin, onQuit }) {
  const [q] = useState(QUIZ_BANK[Math.floor(Math.random() * QUIZ_BANK.length)]);
  const [result, setResult] = useState(null);
  function answer(i) {
    if (i === q.c) { setResult("win"); setTimeout(onWin, 700); }
    else setResult("lose");
  }
  return (
    <div className="ticket p-6 max-w-md">
      <p className="font-semibold mb-4">{q.q}</p>
      <div className="flex flex-col gap-2">
        {q.a.map((opt, i) => (
          <button key={i} onClick={() => answer(i)} disabled={result} className="btn btn-outline py-2 text-sm text-left px-3">{opt}</button>
        ))}
      </div>
      {result === "lose" && <p className="text-sm mt-3" style={{ color: "var(--tomato)" }}>Raté ! Bonne réponse : {q.a[q.c]}.</p>}
      {result === "win" && <p className="text-sm mt-3" style={{ color: "var(--sage)" }}>Bonne réponse !</p>}
      {!result && <button onClick={onQuit} className="text-xs mt-4" style={{ color: "#8A8578" }}>Annuler</button>}
    </div>
  );
}

function MemoryGame({ onWin, onQuit }) {
  const [cards, setCards] = useState(() => {
    const pairs = [...MEMORY_EMOJIS.slice(0, 3), ...MEMORY_EMOJIS.slice(0, 3)];
    return pairs.map((emoji, i) => ({ id: i, emoji, flipped: false, matched: false })).sort(() => Math.random() - 0.5);
  });
  const [selected, setSelected] = useState([]);
  const [moves, setMoves] = useState(0);

  useEffect(() => {
    if (cards.every((c) => c.matched)) setTimeout(onWin, 500);
  }, [cards]);

  function flip(id) {
    if (selected.length === 2) return;
    const card = cards.find((c) => c.id === id);
    if (card.flipped || card.matched) return;
    const newCards = cards.map((c) => (c.id === id ? { ...c, flipped: true } : c));
    const newSelected = [...selected, id];
    setCards(newCards);
    setSelected(newSelected);
    if (newSelected.length === 2) {
      setMoves((m) => m + 1);
      const [a, b] = newSelected.map((sid) => newCards.find((c) => c.id === sid));
      if (a.emoji === b.emoji) {
        setTimeout(() => {
          setCards((cs) => cs.map((c) => (c.id === a.id || c.id === b.id ? { ...c, matched: true } : c)));
          setSelected([]);
        }, 500);
      } else {
        setTimeout(() => {
          setCards((cs) => cs.map((c) => (c.id === a.id || c.id === b.id ? { ...c, flipped: false } : c)));
          setSelected([]);
        }, 700);
      }
    }
  }

  return (
    <div className="ticket p-6 max-w-md">
      <p className="text-sm mb-3" style={{ color: "#8A8578" }}>Coups joués : {moves}</p>
      <div className="grid grid-cols-3 gap-2 mb-4">
        {cards.map((c) => (
          <button
            key={c.id}
            onClick={() => flip(c.id)}
            className="btn h-16 text-2xl flex items-center justify-center"
            style={{ background: c.flipped || c.matched ? "var(--amber-light)" : "var(--pine)", border: "1px solid var(--line)" }}
          >
            {(c.flipped || c.matched) ? c.emoji : ""}
          </button>
        ))}
      </div>
      <button onClick={onQuit} className="text-xs" style={{ color: "#8A8578" }}>Annuler</button>
    </div>
  );
}

function ReflexGame({ onWin, onQuit }) {
  const [state, setState] = useState("waiting"); // waiting | ready | early | result
  const [startTime, setStartTime] = useState(0);
  const [timeoutId, setTimeoutId] = useState(null);

  useEffect(() => {
    const t = setTimeout(() => { setState("ready"); setStartTime(Date.now()); }, 1000 + Math.random() * 2000);
    setTimeoutId(t);
    return () => clearTimeout(t);
  }, []);

  function click() {
    if (state === "waiting") { clearTimeout(timeoutId); setState("early"); return; }
    if (state === "ready") {
      const reaction = Date.now() - startTime;
      if (reaction < 600) { setState("result"); setTimeout(onWin, 600); }
      else { setState("early"); }
    }
  }

  return (
    <div className="ticket p-6 max-w-md">
      <button
        onClick={click}
        className="btn w-full h-40 flex items-center justify-center text-white font-semibold"
        style={{ background: state === "ready" ? "var(--sage)" : state === "early" ? "var(--tomato)" : "var(--pine)" }}
      >
        {state === "waiting" && "Attendez le vert…"}
        {state === "ready" && "Cliquez !"}
        {state === "early" && "Trop tôt, réessayez !"}
        {state === "result" && "Bien joué !"}
      </button>
      {state === "early" && (
        <button onClick={onQuit} className="btn btn-outline py-2 mt-3 text-sm w-full">Retour aux jeux</button>
      )}
      {state !== "early" && state !== "result" && (
        <button onClick={onQuit} className="text-xs mt-3" style={{ color: "#8A8578" }}>Annuler</button>
      )}
    </div>
  );
}

function ChefDashboard({ user, tab, bump }) {
  if (tab === "menu") return <div><h1 className="text-2xl mb-5">Programmer le menu de la semaine</h1><MenuView editable /></div>;
  if (tab === "stock") return <div><h1 className="text-2xl mb-5">Gérer le stock</h1><StockView editable /></div>;

  return null;

function ValidateOrders({ user, bump }) {
  const [orders, setOrders] = useState([]);
  const [filter, setFilter] = useState("en_attente");

  const load = useCallback(async () => { setOrders(await loadAllOrders()); }, []);
  useEffect(() => { load(); }, [load]);

  async function decide(order, decision) {
    await sSet("orders:" + order.id, { ...order, statut: decision, validePar: user.nom });
    if (decision === "refusee") {
      const freshUser = await sGet("users:" + order.userId);
      if (freshUser) await sSet("users:" + order.userId, { ...freshUser, solde: (freshUser.solde || 0) + order.prix });
      await pushNotif(order.userId, `Votre commande du ${order.jour} (${order.plat}) a été refusée. Vous avez été remboursé de ${eur(order.prix)}.`);
    } else {
      await pushNotif(order.userId, `Commande validée ! ${order.jour} — ${order.plat}. Bon appétit !`);
    }
    load();
    bump();
  }

  const filtered = orders.filter((o) => o.statut === filter);

  return (
    <div>
      <h1 className="text-2xl mb-5">Valider les commandes</h1>
      <div className="flex gap-2 mb-5">
        {[["en_attente", "En attente"], ["validee", "Validées"], ["refusee", "Refusées"]].map(([k, l]) => (
          <button key={k} onClick={() => setFilter(k)} className="btn py-1.5 px-3 text-sm" style={{ background: filter === k ? "var(--pine)" : "var(--paper)", color: filter === k ? "white" : "var(--ink)", border: "1px solid var(--line)" }}>{l}</button>
        ))}
      </div>
      <div className="ticket">
        {filtered.length === 0 && <p className="p-4 text-sm" style={{ color: "#8A8578" }}>Aucune commande ici.</p>}
        {filtered.map((o) => (
          <div key={o.id} className="flex items-center justify-between px-4 py-3 border-b last:border-0" style={{ borderColor: "var(--line)" }}>
            <div>
              <p className="font-medium text-sm">{o.userNom} <span style={{ color: "#8A8578" }}>({roleLabel(o.role)})</span> — {o.jour} {o.date}</p>
              <p className="text-xs" style={{ color: "#8A8578" }}>{o.entree ? o.entree + " · " : ""}{o.plat}{o.dessert ? " · " + o.dessert : ""} — {eur(o.prix)}</p>
            </div>
            {o.statut === "en_attente" ? (
              <div className="flex gap-2">
                <button onClick={() => decide(o, "validee")} className="btn btn-primary py-1.5 px-3 text-sm flex items-center gap-1"><CheckCircle2 size={14} /> Valider</button>
                <button onClick={() => decide(o, "refusee")} className="btn btn-danger py-1.5 px-3 text-sm flex items-center gap-1"><XCircle size={14} /> Refuser</button>
              </div>
            ) : (
              <StatusBadge statut={o.statut} />
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

async function loadAllUsers() {
  const keys = await sList("users:");
  const list = await Promise.all(keys.map((k) => sGet(k)));
  return list.filter(Boolean);
}

function CreateStaffAccount({ onCreated }) {
  const [open, setOpen] = useState(false);
  const [nom, setNom] = useState("");
  const [id, setId] = useState("");
  const [pw, setPw] = useState("");
  const [staffRole, setStaffRole] = useState("chef");
  const [msg, setMsg] = useState("");
  const [busy, setBusy] = useState(false);

  async function create(e) {
    e.preventDefault();
    setMsg("");
    if (!nom.trim() || !id.trim() || !pw) return setMsg("Merci de remplir tous les champs.");
    if (pw.length < 4) return setMsg("Le mot de passe doit faire au moins 4 caractères.");
    setBusy(true);
    const key = "users:" + id.trim().toLowerCase();
    const existing = await sGet(key);
    if (existing) { setBusy(false); return setMsg("Cet identifiant est déjà pris."); }
    const saved = await sSet(key, {
      id: id.trim().toLowerCase(), password: await hashPassword(pw), nom: nom.trim(),
      role: staffRole, section: null, solde: 0, createdAt: new Date().toISOString(),
    });
    setBusy(false);
    if (!saved) return setMsg("Erreur de stockage, réessayez.");
    setMsg(`Compte ${roleLabel(staffRole)} créé pour ${nom.trim()}.`);
    setNom(""); setId(""); setPw("");
    onCreated();
  }

  return (
    <div className="ticket p-4 mb-5">
      <button onClick={() => setOpen((o) => !o)} className="btn flex items-center gap-2 text-sm font-semibold" style={{ background: "transparent", color: "var(--pine)" }}>
        <Plus size={16} /> Créer un compte Chef·fe ou Admin
      </button>
      {open && (
        <form onSubmit={create} className="flex flex-wrap gap-2 items-end mt-4">
          <Field label="Rôle">
            <div className="flex gap-2">
              {["chef", "admin"].map((r) => (
                <button type="button" key={r} onClick={() => setStaffRole(r)} className="btn py-2 px-3 text-sm" style={{ background: staffRole === r ? "var(--pine)" : "var(--paper)", color: staffRole === r ? "white" : "var(--ink)", border: "1px solid var(--line)" }}>
                  {roleLabel(r)}
                </button>
              ))}
            </div>
          </Field>
          <Field label="Nom complet"><input className="input" value={nom} onChange={(e) => setNom(e.target.value)} /></Field>
          <Field label="Identifiant"><input className="input" value={id} onChange={(e) => setId(e.target.value)} /></Field>
          <Field label="Mot de passe"><input type="password" className="input" value={pw} onChange={(e) => setPw(e.target.value)} /></Field>
          <button disabled={busy} className="btn btn-primary py-2.5 px-4">Créer</button>
          {msg && <p className="text-xs w-full" style={{ color: msg.includes("créé") ? "var(--sage)" : "var(--tomato)" }}>{msg}</p>}
        </form>
      )}
    </div>
  );
}
